# ============================================================
# HidroControl-3
# Laboratório MQTT — Broker Público
#
# Fase inicial:
# - MQTT sem TLS
# - Sem autenticação
# - Sem ACL
# - Sem bridge
# ============================================================

# Porta MQTT utilizada pelo Broker Público no laboratório.
listener 1883 0.0.0.0

# Acesso anônimo permitido somente nesta fase inicial.
allow_anonymous true

# Persistência desativada temporariamente.
persistence false

# Logs enviados ao terminal.
log_dest stdout

# Exibe todos os tipos de mensagens no laboratório.
log_type all

# Registra conexões e desconexões.
connection_messages true

# ============================================================
# Bridge: Broker Público → Broker Privado
#
# Nesta etapa:
# - conexão local sem TLS;
# - sem usuário e senha;
# - tráfego somente do Público para o Privado;
# - somente tópicos da árvore hidrocontrol/.
# ============================================================

# Nome único da conexão da bridge.
connection publico-para-privado

# Endereço e porta do Broker Privado.
address 127.0.0.1:1884

# Identificador MQTT utilizado pela bridge.
remote_clientid bridge-publico-privado

# Encaminha do broker local (Público) para o remoto (Privado).
# Formato: topic <filtro> <direção> <QoS>
topic hidrocontrol/# out 1

# Inicia a bridge automaticamente.
start_type automatic

# Intervalo de tentativa de reconexão.
restart_timeout 5

# Sessão limpa nesta fase inicial do laboratório.
cleansession true

# Protocolo MQTT usado entre os brokers.
bridge_protocol_version mqttv311

# Evita notificações adicionais da bridge nesta primeira etapa.
notifications false


